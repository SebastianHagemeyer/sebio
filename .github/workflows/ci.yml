name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: Format & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prettier (check formatting)
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: Build (Eleventy)
        run: npm run build
