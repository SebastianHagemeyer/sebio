---
layout: base.njk
title: "SRMER: Negative Feedback Matching"
tagline: Drag each example into the correct part of the feedback loop.
---

<style>
  body {
    background: var(--color-bg);
    text-align: center;
  }

  .container {
    max-width: 880px;
    margin: 2.5rem auto;
    padding: 2rem 1.5rem;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
  }

  .labels,
  .dropzones {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0.6rem;
    margin-bottom: 1.25rem;
  }

  .label {
    font-weight: 600;
    color: var(--color-brand);
    background: var(--color-brand-soft);
    border: 1px solid var(--color-border);
    padding: 0.6rem 0.5rem;
    border-radius: var(--radius-sm);
  }

  .drop {
    min-height: 64px;
    background: var(--color-surface);
    border: 2px dashed var(--color-border);
    padding: 0.6rem;
    border-radius: var(--radius-sm);
    transition:
      background 0.2s ease,
      border-color 0.2s ease;
  }

  .drop:hover {
    background: var(--color-surface-hover);
    border-color: var(--color-accent);
  }

  .draggables {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }

  .drag {
    background: var(--color-surface);
    color: var(--color-text);
    border: 1px solid var(--color-border);
    padding: 0.55rem 1rem;
    border-radius: var(--radius-pill);
    box-shadow: var(--shadow-sm);
    cursor: grab;
    transition:
      background 0.2s ease,
      border-color 0.2s ease,
      box-shadow 0.2s ease;
  }

  .drag:hover {
    border-color: var(--color-accent);
    box-shadow: var(--shadow);
  }

  .drag:active {
    cursor: grabbing;
  }

  #feedback {
    margin-top: 1.25rem;
    font-weight: 600;
  }

  #scenario {
    margin-bottom: 1.25rem;
    padding: 0.55rem 0.85rem;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--color-text);
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
  }

  label[for="scenario"] {
    font-weight: 600;
    color: var(--color-text-muted);
    margin-right: 0.5rem;
  }

  .modal {
    display: none;
    position: fixed;
    z-index: 999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(4px);
    justify-content: center;
    align-items: center;
  }

  .scenario-modal-content {
    background-color: var(--color-surface);
    color: var(--color-text);
    padding: 2.5rem 3rem;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    text-align: center;
    font-size: 2em;
    font-weight: 600;
    box-shadow: var(--shadow-modal);
    animation: popFade 0.4s ease;
  }

  .tick {
    font-size: 3em;
    color: green;
    display: block;
    margin-bottom: 0.5em;
  }

  @keyframes popFade {
    0% {
      transform: scale(0.5);
      opacity: 0;
    }
    100% {
      transform: scale(1);
      opacity: 1;
    }
  }
</style>

<div class="container">
  <div id="correctModal" class="modal" role="alertdialog" aria-modal="true">
    <div class="scenario-modal-content" aria-live="assertive">
      <span class="tick">✔</span>
      <p>Correct!</p>
    </div>
  </div>

  <label for="scenario">Choose a scenario:</label>
  <select id="scenario" onchange="loadScenario()">
    <option value="highGlucose">High Blood Glucose</option>
    <option value="lowGlucose">Low Blood Glucose</option>
    <option value="highTemp">High Temperature</option>
    <option value="lowTemp">Low Temperature</option>
    <option value="childbirth">Childbirth (Positive Feedback)</option>
    <option value="adhResponse">ADH, increased osmolarity</option>
  </select>

  <div class="labels">
    <div class="label">Stimulus</div>
    <div class="label">Receptor</div>
    <div class="label">Modulator</div>
    <div class="label">Effector</div>
    <div class="label">Response</div>
  </div>

  <div class="dropzones">
    <div class="drop" data-type="Stimulus"></div>
    <div class="drop" data-type="Receptor"></div>
    <div class="drop" data-type="Modulator"></div>
    <div class="drop" data-type="Effector"></div>
    <div class="drop" data-type="Response"></div>
  </div>

  <div class="draggables" id="draggables"></div>

  <button onclick="checkAnswers()">Check Answers</button>
  <div id="feedback" aria-live="polite"></div>
  <div id="happyBladderCounter" style="font-size: 2em; margin-top: 1em"></div>
</div>

<script src="/SRMER/script.js"></script>
