<style>
  body {
    font-family: Arial, sans-serif;
    background: #d0f4f7;
    color: #333;
  }

  #leaderboard {
    max-width: 400px;
    margin: 0 auto;
    background: white;
    border-radius: 12px;
    padding: 1em 2em;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
  }

  #leaderboard h2 {
    margin-bottom: 1em;
    color: var(--color-accent);
  }

  #leaderboard-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  #leaderboard-list li {
    font-size: 1.1em;
    margin: 0.5em 0;
    padding: 0.3em 0;
    border-bottom: 1px solid #eee;
  }

  #leaderboard-list li:last-child {
    border-bottom: none;
  }
</style>

<div id="leaderboard">
  <h2>🏆 Top Players</h2>
  <ul id="leaderboard-list">
    <li>Loading...</li>
  </ul>
</div>

<script src="/scripts/leaderboard.js"></script>
<script>
  async function loadLeaderboard() {
    const list = document.getElementById("leaderboard-list");
    try {
      const data = await window.Leaderboard.getScores(10);
      list.textContent = "";

      if (!data.length) {
        const li = document.createElement("li");
        li.textContent = window.Leaderboard.isConfigured()
          ? "No scores yet — be the first!"
          : "Leaderboard not configured yet.";
        list.appendChild(li);
        return;
      }

      data.forEach((entry, index) => {
        const li = document.createElement("li");
        li.textContent = `${index + 1}. ${entry.name}: ${entry.score}`;
        list.appendChild(li);
      });
    } catch (err) {
      console.error("Failed to load leaderboard:", err);
      list.textContent = "";
      const li = document.createElement("li");
      li.textContent = "Error loading leaderboard";
      list.appendChild(li);
    }
  }

  loadLeaderboard();
</script>
